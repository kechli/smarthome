<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SmartHome">
<link rel="apple-touch-icon" href="https://img.icons8.com/color/180/smart-home.png">
    <title>Smart Home Control Panel</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .card h3 { margin-top: 0; color: #f1f5f9; }
        .type-badge { background: #334155; color: #94a3b8; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; text-transform: uppercase; }
        .status { font-size: 1.1rem; margin: 15px 0; font-weight: bold; }
        .active { color: #4ade80; }
        .inactive { color: #f87171; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-on { background-color: #22c55e; color: white; }
        .btn-on:hover { background-color: #16a34a; }
        .btn-off { background-color: #ef4444; color: white; }
        .btn-off:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <h1>🏠 Smart Home Simulation Dashboard</h1>
    
    <div id="devices-container" class="grid">
        <!-- Εδώ θα εμφανιστούν αυτόματα οι συσκευές -->
    </div>

    <script>
        // Φόρτωση όλων των συσκευών από το GET /devices/
        async function loadDevices() {
            try {
                const response = await fetch('/devices/');
                const devices = await response.json();
                
                const container = document.getElementById('devices-container');
                container.innerHTML = '';

                if (devices.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Δεν υπάρχουν καταχωρημένες συσκευές στη βάση.</p>';
                    return;
                }

                devices.forEach(device => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${device.name}</h3>
                        <span class="type-badge">${device.device_type}</span>
                        <div class="status ${device.is_active ? 'active' : 'inactive'}">
                            ${device.is_active ? '⚡ ΕΝΕΡΓΟ (ON)' : '⚪ ΑΠΕΝΕΡΓΟ (OFF)'}
                        </div>
                        <button class="btn ${device.is_active ? 'btn-off' : 'btn-on'}" onclick="toggleDevice(${device.id})">
                            ${device.is_active ? 'Σβήσιμο' : 'Άναμμα'}
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Σφάλμα κατά τη φόρτωση των συσκευών:", err);
            }
        }

        // Αλλαγή κατάστασης συσκευής (ON/OFF) μέσω POST /devices/{id}/toggle
        async function toggleDevice(id) {
            await fetch(`/devices/${id}/toggle`, { method: 'POST' });
            loadDevices(); // Ανανέωση της οθόνης
        }

        // Φόρτωση συσκευών μόλις ανοίξει η σελίδα
        loadDevices();
    </script>
</body>
</html>
