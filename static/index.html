<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Control Panel</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        h1, h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card-panel { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 25px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        
        /* 📍 ΤΟ GRID ΣΟΥ */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; }
        .type-badge { background: #334155; color: #94a3b8; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; text-transform: uppercase; }
        .status { font-size: 1.1rem; margin: 15px 0; font-weight: bold; }
        .active { color: #4ade80; }
        .inactive { color: #f87171; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-on { background-color: #22c55e; color: white; }
        .btn-off { background-color: #ef4444; color: white; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; float: right; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <button class="btn-logout" onclick="logout()">Αποσύνδεση</button>
        <h1>🏠 Smart Home Control Panel</h1>
        <p style="text-align: center; margin-bottom: 25px;">
            Χρήστης: <b id="user-display"></b> <span id="role-badge"></span>
        </p>

        <!-- ΦΟΡΜΑ ΠΡΟΣΘΗΚΗΣ (ΕΜΦΑΝΙΖΕΤΑΙ ΜΟΝΟ ΣΤΟΥΣ ADMINS) -->
        <div id="admin-panel" class="card-panel hidden" style="max-width: 500px; margin: 0 auto 30px auto;">
            <h2>➕ Προσθήκη Συσκευής (Admin)</h2>
            <input type="text" id="device-name" placeholder="Όνομα Συσκευής">
            <select id="device-type">
                <option value="light">Φως</option>
                <option value="relay">Ρελέ / Διακόπτης</option>
            </select>
            <button class="btn btn-on" onclick="addDevice()">Προσθήκη</button>
        </div>

        <!-- GRID ΣΥΣΚΕΥΩΝ -->
        <div id="devices-container" class="grid"></div>
    </div>

    <script>
        function getAuthHeader() {
            const token = localStorage.getItem('token');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        // Έλεγχος αν υπάρχει token - αλλιώς ανακατεύθυνση στο login.html
        async function initDashboard() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/static/login.html';
                return;
            }

            try {
                const resUser = await fetch('/users/me', { headers: getAuthHeader() });
                if (!resUser.ok) { logout(); return; }
                
                const user = await resUser.json();
                document.getElementById('user-display').innerText = user.username;
                document.getElementById('role-badge').innerText = user.is_admin ? '(Admin 👑)' : '(User 👤)';

                if (user.is_admin) {
                    document.getElementById('admin-panel').classList.remove('hidden');
                }

                loadDevices();
            } catch (err) {
                console.error('Init error:', err);
            }
        }

        async function loadDevices() {
            try {
                const response = await fetch('/devices/', { headers: getAuthHeader() });
                if (response.status === 401) { logout(); return; }

                const devices = await response.json();
                const container = document.getElementById('devices-container');
                container.innerHTML = '';

                if (devices.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Δεν υπάρχουν καταχωρημένες συσκευές στη βάση.</p>';
                    return;
                }

                devices.forEach(function(device) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${device.name}</h3>
                        <span class="type-badge">${device.device_type}</span>
                        <div class="status ${device.is_active ? 'active' : 'inactive'}">
                            ${device.is_active ? '⚡ ΕΝΕΡΓΟ (ON)' : '⚪ ΑΠΕΝΕΡΓΟ (OFF)'}
                        </div>
                        <button class="btn ${device.is_active ? 'btn-off' : 'btn-on'}" onclick="toggleDevice(${device.id})">
                            ${device.is_active ? 'Σβήσιμο' : 'Άναμμα'}
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading devices:', err);
            }
        }

        async function toggleDevice(id) {
            await fetch('/devices/' + id + '/toggle', { method: 'POST', headers: getAuthHeader() });
            loadDevices();
        }

        async function addDevice() {
            const name = document.getElementById('device-name').value;
            const type = document.getElementById('device-type').value;
            if (!name) return alert('Δώστε όνομα συσκευής');

            const url = '/devices/?name=' + encodeURIComponent(name) + '&device_type=' + encodeURIComponent(type);
            const res = await fetch(url, { method: 'POST', headers: getAuthHeader() });

            if (res.ok) {
                document.getElementById('device-name').value = '';
                loadDevices();
            } else {
                alert('Σφάλμα: Δεν έχετε δικαίωμα προσθήκης!');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/static/login.html';
        }

        initDashboard();
    </script>
</body>
</html>
